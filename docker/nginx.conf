# Bird of the Day — minimal non-root nginx serving the static site on 8080.
# Logs to stdout/stderr so `docker logs` works.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx insists on writable temp dirs even when we don't proxy/upload.
    # Point them at /tmp so a --read-only root filesystem still works
    # (operators add a tmpfs mount for /tmp in that case).
    client_body_temp_path  /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    # Cache headers — modest TTLs because the content rotates daily.
    # The feed arm has to name both files: the location blocks below only
    # add the header, the value itself is computed here, so a pattern
    # matching just /feed.xml would quietly give /feed-full.xml the
    # shorter default TTL.
    map $request_uri $cache_control {
        default                   "public, max-age=300";
        ~*/feed(-full)?\.xml$     "public, max-age=600";
        ~*/(index|archive)\.html$ "public, max-age=300";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /var/lib/botd;
        index index.html;
        # Preserves the 404 status: this only substitutes the body,
        # unlike "error_page 404 =200 ..." which would rewrite it to 200.
        error_page 404 /404.html;

        # Liveness endpoint — used by docker HEALTHCHECK and any external
        # uptime monitor that wants a cheap "is nginx up" probe.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Explicit allow-list — no directory listings, no leaking the
        # cache/ subtree, no surprises.
        location = / {
            try_files /index.html =503;
            add_header Cache-Control $cache_control always;
        }

        location = /index.html {
            add_header Cache-Control $cache_control always;
        }

        location = /archive.html {
            add_header Cache-Control $cache_control always;
        }

        # This location is also where error_page above sends every 404,
        # not only a direct request for this exact path, so its
        # Cache-Control has to be right for both. $cache_control would
        # let an intermediary cache a 404 for a URL that turns valid
        # minutes later (a species page the day its bird is first
        # published), so this is the one location that opts out of it
        # entirely instead of reusing the shared value.
        location = /404.html {
            add_header Cache-Control "no-store" always;
        }

        location = /robots.txt {
            add_header Cache-Control $cache_control always;
        }

        location = /sitemap.xml {
            add_header Cache-Control $cache_control always;
        }

        # Month buckets: one page per calendar month, permanent.
        # The regex is quoted because nginx reads { and } as block
        # delimiters: unquoted, {4} ends the location before it starts
        # and the whole config fails to parse.
        location ~ "^/archive-\d{4}-\d{2}\.html$" {
            add_header Cache-Control $cache_control always;
        }

        # Canonical page per species.
        location /birds/ {
            add_header Cache-Control $cache_control always;
        }

        location = /feed.xml {
            add_header Cache-Control $cache_control always;
            types { } default_type application/rss+xml;
        }

        location = /feed-full.xml {
            add_header Cache-Control $cache_control always;
            types { } default_type application/rss+xml;
        }

        # Composed map PNGs referenced from the RSS feed.
        location /maps/ {
            add_header Cache-Control $cache_control always;
        }

        # Everything write_site publishes under assets/: the stylesheet
        # (site.css), the four self-hosted woff2 webfonts under fonts/,
        # and the basemap PNG. The fonts and the basemap are committed
        # binaries that only change when the repository does, so a day is
        # a comfortable TTL for them.
        #
        # site.css is not immutable, and this TTL applies to it too: the
        # stylesheet is generated from site_css.py on every run, so after
        # a design change a reader who already has it cached can keep
        # seeing the old one for up to 24 hours. The filename is stable
        # (no content hash), so there is nothing here to bust the cache
        # with. That is the accepted trade for a site whose content
        # rotates once a day; if you need a design change to land
        # immediately, lower this value.
        location /assets/ {
            add_header Cache-Control "public, max-age=86400" always;
        }

        location / {
            return 404;
        }
    }
}
