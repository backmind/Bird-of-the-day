[project]
name = "bird-of-the-day"
version = "1.3.0"
description = "Daily bird species RSS feed powered by eBird"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "langid>=1.1.6,<2",
    "Pillow>=12.2,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Development only. The four runtime dependencies above are the whole of
# what a published site needs; nothing here may ever move up into them.
# Playwright in particular ships a browser, and the browser suite that
# uses it skips itself when either the package or the browser is absent
# (see tests/test_browser.py), so an ordinary `uv run pytest` on a fresh
# clone still reports the whole suite green plus those skips.
dev = [
    "pytest>=9.0.3",
    "playwright>=1.49",
]

[tool.pytest.ini_options]
markers = [
    "browser: needs Playwright and a real browser; skipped when either is absent",
]
